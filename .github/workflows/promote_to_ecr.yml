name: Promote Dev Model to ECR

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mlflow boto3

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Export model
        run: |
          python export_model.py "dev-version1" "champion"

      - name: Login to ECR
        run: |
          run: |
              $password = aws ecr get-login-password --region $env:AWS_REGION
              $password | docker login --username AWS --password-stdin 808241399320.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image
        run: docker build -t ${{ secrets.ECR_REPOSITORY }}:dev .

      - name: Push Docker image to ECR
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:dev \
                     ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:dev
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:dev
